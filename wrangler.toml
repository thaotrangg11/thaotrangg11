name = "tg-bomber-bot"
main = "src/worker.py"
compatibility_date = "2024-12-01"
compatibility_flags = ["python_workers"]

# KV namespace — tạo bằng:
#   wrangler kv namespace create BOT_KV
# Rồi dán ID vào đây.
[[kv_namespaces]]
binding = "BOT_KV"
id = "PASTE_KV_ID_HERE"

[vars]
FREE_DAILY_ROUNDS = "3"
MAX_ROUNDS_HARD = "100"
MAX_SUBREQUESTS = "45"   # chừa 5 cho Telegram API
